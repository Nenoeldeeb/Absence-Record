# --------------------------------------------------------------------
# Project-wide Gradle settings.
# Settings defined here apply to all modules unless overridden.
# --------------------------------------------------------------------
# JVM arguments for the Gradle daemon.
# Controls memory usage, garbage collection, encoding, and diagnostics.
# Default: [Inference] roughly "-Xmx1g -Dfile.encoding=UTF-8"
org.gradle.jvmargs = -Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Enables parallel execution of independent projects (multi-module builds).
# Improves build speed when modules are decoupled.
# Default: false
org.gradle.parallel = true
# Enables the Gradle daemon (persistent background process).
# Reduces startup time for subsequent builds.
# Default: true (since Gradle 3.x+)
org.gradle.daemon = true
# Enables the Gradle build cache.
# Allows reuse of task outputs between builds.
# Default: false in older Gradle, true in newer Gradle versions [Inference]
org.gradle.caching = true
# Enables configuration cache (caches the configuration phase).
# Speeds up repeated builds but has strict compatibility requirements.
# Default: false
org.gradle.configuration-cache = false
# --------------------------------------------------------------------
# Android build system settings
# --------------------------------------------------------------------
# Forces usage of AndroidX libraries instead of legacy support libraries.
# Required for modern Android development.
# Default: false historically, true for new projects [Inference]
android.useAndroidX = true
# Controls whether resValue build feature is enabled by default.
# Disabling reduces unnecessary generated resources.
# Default: true historically, false in newer AGP [Inference]
android.defaults.buildfeatures.resvalues = false
# Generates the app R class at compile time instead of runtime.
# Improves incremental build performance.
# Default: false historically, true in newer AGP [Inference]
android.enableAppCompileTimeRClass = true
# Disallows <uses-sdk> declarations inside AndroidManifest.xml.
# Forces SDK versions to be defined only via Gradle DSL.
# Default: false
android.usesSdkInManifest.disallowed = true
# Enforces unique namespaces/package names across modules.
# Helps avoid class/resource conflicts in large projects.
# Default: false
android.uniquePackageNames = false
# Enables dependency constraints during dependency resolution.
# Affects how versions are aligned across configurations.
# Default: false (may change in newer AGP) [Inference]
android.dependency.useConstraints = false
# Enables stricter behavior for R8 keep rules in full mode.
# Can surface hidden issues but may increase breakage risk.
# Default: false
android.r8.strictFullModeForKeepRules = false
# Disallows defining Kotlin-specific source sets in Android modules.
# Rarely needed; mainly for strict build setups.
# Default: false
android.disallowKotlinSourceSets = false
# Generates non-transitive R classes for libraries.
# Each module's R contains only its own resources.
# Improves build speed and encapsulation.
# Default: false historically, true for new projects [Inference]
android.nonTransitiveRClass = true
# --------------------------------------------------------------------
# Kotlin & KSP settings
# --------------------------------------------------------------------
# Defines Kotlin formatting style.
# "official" follows JetBrains Kotlin style guide.
# Default: official
kotlin.code.style = official
# Enables incremental Kotlin compilation.
# Recompiles only changed sources.
# Default: true
kotlin.incremental = true
# Enables incremental processing for Kotlin Symbol Processing (KSP).
# Reduces annotation processing time.
# Default: true
ksp.incremental = true
# Enables inter-module incremental processing for KSP.
# Can be unsafe in complex dependency graphs.
# Default: false
ksp.incremental.intermodule = false